<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="110" fill="#0a0a0a"/>
  <!-- Flame shape -->
  <path d="M256 80
    C256 80 310 140 320 200
    C330 260 300 280 300 280
    C310 240 285 210 270 220
    C270 220 295 170 256 120
    C217 170 242 220 242 220
    C227 210 202 240 212 280
    C212 280 182 260 192 200
    C202 140 256 80 256 80Z"
    fill="url(#flame)" opacity="0.95"/>
  <!-- Letter F -->
